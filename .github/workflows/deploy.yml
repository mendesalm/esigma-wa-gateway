name: Deploy Automático esigma-wa-gateway

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install & Test
        run: |
          npm ci
          npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy na VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            APP_DIR="/var/www/esigma-wa-gateway"
            if [ ! -d "$APP_DIR/.git" ]; then
              sudo mkdir -p "$APP_DIR"
              sudo chown -R "$(whoami)":"$(whoami)" "$APP_DIR"
              git clone https://github.com/mendesalm/esigma-wa-gateway.git "$APP_DIR"
            fi
            cd "$APP_DIR"
            git pull origin main

            if [ ! -f .env ]; then
              cp .env.example .env
              GEN_KEY=$(openssl rand -hex 24)
              sed -i "s/^WA_GATEWAY_KEY=.*/WA_GATEWAY_KEY=${GEN_KEY}/" .env
              echo "Arquivo .env criado. Verifique a porta em WA_GATEWAY_PORT (padrão 8004)."
            fi

            PORTA_GW=$(grep -E '^WA_GATEWAY_PORT=' .env | cut -d'=' -f2 || true)
            PORTA_GW=${PORTA_GW:-8004}
            echo "Verificando porta ${PORTA_GW} na VPS:"
            ss -tulpn | grep ":${PORTA_GW} " || echo "Porta ${PORTA_GW} livre."

            docker compose up -d --build
