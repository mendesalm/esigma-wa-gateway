services:
  wa-gateway:
    build: .
    container_name: esigma-wa-gateway
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WA_GATEWAY_PORT:-8004}:8004"
    environment:
      HOST: "0.0.0.0"
      PORT: "8004"
      DATA_DIR: "/app/data"
      WA_GATEWAY_KEY: "${WA_GATEWAY_KEY}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
    volumes:
      - ./data:/app/data
